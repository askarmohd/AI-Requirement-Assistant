name: CI Pipeline

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"

      - name: Verify Python Installation
        run: python --version

      - name: Verify Repository Structure
        run: |
          test -d BackEnd
          test -d FrontEnd
          test -d Docs
          test -d Infra

      - name: Pipeline Success
        run: echo "Repository validation completed"